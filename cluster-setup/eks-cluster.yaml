apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: multi-tier-cluster
  region: eu-west-1
  version: "1.27"

nodeGroups:
  - name: worker-nodes
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 50
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true

addons:
  - name: aws-ebs-csi-driver
    version: latest