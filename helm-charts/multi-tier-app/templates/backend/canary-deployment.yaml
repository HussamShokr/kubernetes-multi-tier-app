apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: multi-tier
  labels:
    app: backend
    tier: backend
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      tier: backend
      version: canary
  template:
    metadata:
      labels:
        app: backend
        tier: backend
        version: canary
    spec:
      containers:
      - name: backend-canary
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/backend:canary
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URI
          value: "mongodb://app-user:app-password@mongodb.multi-tier.svc.cluster.local:27017/app-database"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10